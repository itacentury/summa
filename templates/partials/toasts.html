{% from "partials/_macros.html" import icon_close %}
<!-- Undo Toast -->
<div
  class="toast"
  data-el="undoToast"
  role="status"
  aria-live="polite"
  aria-atomic="true"
>
  <span class="toast-message" data-el="toastMessage"></span>
  <button type="button" class="toast-action" data-el="toastUndo">Undo</button>
  <button type="button" class="toast-close" data-el="toastClose" title="Close">
    {{ icon_close(16) }}
  </button>
  <div class="toast-progress" data-el="toastProgress"></div>
</div>
<div
  class="toast error-toast"
  data-el="errorToast"
  role="alert"
  aria-live="assertive"
  aria-atomic="true"
>
  <span class="toast-message" data-el="errorToastMessage"></span>
  <button
    type="button"
    class="toast-close"
    data-el="errorToastClose"
    title="Close"
  >
    {{ icon_close(16) }}
  </button>
  <div class="toast-progress" data-el="errorToastProgress"></div>
</div>

{% from "partials/_macros.html" import icon_close %}
<!-- Bulk Action Toolbar -->
<div class="bulk-action-toolbar" data-el="bulk-action-toolbar">
  <div class="bulk-action-content">
    <span class="bulk-action-count">
      <span data-el="selected-count">0</span> selected
    </span>
    <div class="bulk-action-buttons">
      <button
        class="btn btn-secondary btn-sm"
        data-action="select-all"
        aria-pressed="false"
      >
        <span class="label-long">Select All</span>
        <span class="label-short">All</span>
      </button>
      <button class="btn btn-primary btn-sm" data-action="bulk-edit">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
          />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
        Edit
      </button>
      <button class="btn btn-danger btn-sm" data-action="bulk-delete">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="3 6 5 6 21 6" />
          <path
            d="m19 6-.867 12.142A2 2 0 0 1 16.138 20H7.862a2 2 0 0 1-1.995-1.858L5 6"
          />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
          <path
            d="m8 6 .544-1.632A2 2 0 0 1 10.442 3h3.116a2 2 0 0 1 1.898 1.368L16 6"
          />
        </svg>
        Delete
      </button>
      <button
        class="btn-bulk-close"
        data-action="deselect-all"
        aria-label="Deselect all"
      >
        {{ icon_close(16) }}
      </button>
    </div>
  </div>
</div>

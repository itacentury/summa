<!-- Top Bar -->
{# Mobile-only: hidden on desktop, where the sidebar becomes the drawer. #}
<header class="topbar">
  <button
    class="topbar-btn"
    data-el="drawer-toggle"
    aria-label="Menu"
    aria-expanded="false"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>
  <div class="topbar-logo">
    <img src="{{ url_for('static', filename='icons/icon-96.png') }}" alt="" />
  </div>
  <div class="topbar-title" data-el="topbar-title">Invoices</div>
  <button
    class="topbar-btn topbar-search-btn"
    data-el="search-toggle"
    aria-label="Search"
    aria-expanded="false"
  >
    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="11" cy="11" r="8" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
  </button>
</header>
<button
  class="drawer-scrim"
  data-el="drawer-scrim"
  aria-label="Close menu"
  tabindex="-1"
></button>

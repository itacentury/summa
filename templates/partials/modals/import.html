{% from "partials/_macros.html" import modal_close_button %}
<!-- Import Modal -->
<div class="modal-overlay" data-el="import-modal">
  <div
    class="modal modal-sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="import-title"
  >
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="modal-header">
      <h3 class="modal-title" id="import-title">JSON Import</h3>
      {{ modal_close_button() }}
    </div>
    <div class="modal-body">
      <div data-el="import-input">
        <div class="dropzone" data-el="dropzone">
          <div class="dropzone-icon">
            <svg
              width="26"
              height="26"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
          </div>
          <div class="dropzone-text">
            <span class="label-long"
              >Drag JSON files here or click to select</span
            >
            <span class="label-short">Tap to select JSON files</span>
            <br /><small class="text-muted">Multiple files supported</small>
          </div>
          <input
            type="file"
            class="is-hidden"
            data-el="file-input"
            aria-label="Select JSON files"
            accept=".json"
            multiple
          />
        </div>
        <div class="is-hidden mb-1" data-el="selected-files"></div>
        <div class="form-group">
          <label class="form-label" for="json-input"
            >Or paste JSON directly</label
          >
          <textarea
            id="json-input"
            class="form-input json-textarea"
            data-el="json-input"
            data-autofocus
            placeholder='[{"date": "2024-01-01", "store": "...", "total": "...", "items": [...]}]'
          ></textarea>
        </div>
      </div>
      <div class="is-hidden" data-el="import-errors"></div>
    </div>
    <div class="modal-footer">
      <button
        class="btn btn-secondary"
        data-action="cancel"
        title="Cancel (Esc)"
      >
        Cancel
      </button>
      <button
        class="btn btn-primary"
        data-action="import"
        title="Import (Ctrl+Enter)"
      >
        Import
      </button>
    </div>
  </div>
</div>

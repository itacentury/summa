{% from "partials/_macros.html" import modal_close_button %}
<!-- Settings Modal -->
<div class="modal-overlay" data-el="settings-modal">
  <div
    class="modal modal-sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="settings-title"
  >
    <div class="modal-header">
      <h3 class="modal-title" id="settings-title">Settings</h3>
      <!-- Focused on open so the destructive sign-out row below is never
           one keystroke away. -->
      {{ modal_close_button(autofocus=true) }}
    </div>
    <div class="modal-body">
      <!-- Revealed by the boot gate only when the password feature is enabled,
           so an unauthenticated deployment shows no dead control. Every setting
           row carries `data-setting`; that is what the empty state below is
           derived from when the modal opens. -->
      <button class="settings-action" data-setting data-el="logout" hidden>
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span>Sign out</span>
      </button>
      <p class="settings-empty" data-el="settings-empty" hidden>
        No settings available yet.
      </p>
    </div>
  </div>
</div>

{% from "partials/_macros.html" import modal_close_button, combobox %}
<!-- Bulk Edit Modal -->
<div class="modal-overlay" data-el="bulk-edit-modal">
  <div
    class="modal modal-sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="bulk-edit-title"
  >
    <div class="modal-header">
      <h3 class="modal-title" id="bulk-edit-title">Bulk Edit</h3>
      {{ modal_close_button() }}
    </div>
    <div class="modal-body">
      <p class="bulk-edit-note">
        <span data-el="bulk-edit-count">0</span> invoice(s) selected
      </p>
      <div class="form-group">
        <label class="form-label" for="bulk-edit-store">New Store Name</label>
        <input
          type="text"
          id="bulk-edit-store"
          class="form-input"
          data-el="bulk-edit-store"
          data-autofocus
          placeholder="e.g. Walmart (leave empty to keep unchanged)"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="bulk-edit-category-input"
          >New Category</label
        >
        {{ combobox("bulk-edit-category") }}
      </div>
    </div>
    <div class="modal-footer">
      <button
        class="btn btn-secondary"
        data-action="cancel"
        title="Cancel (Esc)"
      >
        Cancel
      </button>
      <button
        class="btn btn-primary"
        data-action="save"
        title="Save (Ctrl+Enter)"
      >
        Save
      </button>
    </div>
  </div>
</div>

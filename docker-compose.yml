services:
  summa:
    build: .
    container_name: summa
    restart: unless-stopped
    # Serves plain HTTP only — put a TLS-terminating reverse proxy in front for
    # any non-localhost deployment (see "Production Deployment" in README.md).
    ports:
      - 8000:8000/tcp
    volumes:
      - ./data:/data
    # Optional .env supplies ANTHROPIC_API_KEY, ENABLE_AI_SUGGESTIONS, and any
    # other overrides. Missing file is fine — copy .env.example to .env.
    # Compose reads it with dotenv rules, the same ones `uv run --env-file` uses:
    # a value containing `$` (AUTH_PASSWORD_HASH does) has to be single-quoted or
    # it is expanded as a variable reference, silently mangling the hash.
    env_file:
      - path: .env
        required: false

  # Refreshes the chart's benchmark series from the same image. A failed fetch
  # only logs and is retried after an hour (the interval floor) rather than a
  # full interval, so the loop never exits. Because of that, the interval is
  # checked once up front: a value `sleep` would reject or a too-short one would
  # turn the loop into a hot loop against the feed.
  benchmark:
    build: .
    restart: unless-stopped
    # tini forwards SIGTERM, so a stop does not wait out the sleep
    init: true
    # The image's healthcheck probes the web server, which this service lacks
    healthcheck:
      disable: true
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    command:
      - sh
      - -c
      - |
        interval="$${BENCHMARK_INTERVAL_SECONDS:-86400}"
        case "$$interval" in
          '' | *[!0-9]*)
            echo "BENCHMARK_INTERVAL_SECONDS='$$interval' is not a number of seconds, using 86400" >&2
            interval=86400
            ;;
        esac
        if [ "$$interval" -lt 3600 ]; then
          echo "BENCHMARK_INTERVAL_SECONDS=$$interval is below the 3600 s floor, using 3600" >&2
          interval=3600
        fi
        while true; do
          if python -m scripts.fetch_benchmark; then
            sleep "$$interval"
          else
            sleep 3600
          fi
        done
